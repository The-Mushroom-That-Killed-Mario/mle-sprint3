services:
  main-app:
    env_file:
      - ./.env

    build:
      dockerfile: Dockerfile_main

    ports:
      - "${MAIN_APP_PORT_VM}:${MAIN_APP_PORT}"

    volumes:
      - type: bind
        source: ./speeches
        target: /app_with_counter/speeches

  counter-app:
    env_file:
      - ./.env

    build:
      dockerfile: Dockerfile_counter

    hostname: counter

    ports:
      - "${COUNTER_APP_PORT_VM}:${COUNTER_APP_PORT}"